    <script>
      // Prevent uncaught "WebSocket closed without opened" rejections and repetitive connection logs
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason)) ? String(reason.message || reason) : '';
        if (msg.includes('WebSocket closed without opened') || msg.includes('failed to connect to websocket')) {
          event.preventDefault();
        }
      });
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments.length > 0 ? String(arguments[0]) : '';
          if (
            firstArg.includes('failed to connect to websocket') ||
            firstArg.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
  </head>
